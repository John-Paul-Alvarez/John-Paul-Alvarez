<svg width="1000" height="140" viewBox="0 0 1000 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated footer</title>
  <desc id="desc">Animated wave footer for a GitHub profile README.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#F78166"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-250 0;250 0;-250 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="140" rx="18" fill="#0D1117"/>

  <text x="500" y="36" text-anchor="middle" fill="#E6EDF3" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Open to software developer opportunities</text>
  <text x="500" y="64" text-anchor="middle" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="15">Full-stack apps | Backend APIs | Databases | Testing | Deployment</text>

  <path d="M0 100 C160 58 300 132 465 100 C640 56 750 132 1000 92 L1000 140 L0 140 Z" fill="url(#wave)" opacity="0.34">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0 100 C160 58 300 132 465 100 C640 56 750 132 1000 92 L1000 140 L0 140 Z; M0 92 C175 128 315 68 500 103 C685 134 780 70 1000 102 L1000 140 L0 140 Z; M0 100 C160 58 300 132 465 100 C640 56 750 132 1000 92 L1000 140 L0 140 Z"/>
  </path>
  <path d="M0 106 C210 72 350 128 520 104 C710 76 810 124 1000 98" stroke="url(#wave)" stroke-width="3" opacity="0.85">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 106 C210 72 350 128 520 104 C710 76 810 124 1000 98; M0 96 C200 130 360 74 530 108 C690 136 825 78 1000 110; M0 106 C210 72 350 128 520 104 C710 76 810 124 1000 98"/>
  </path>
</svg>

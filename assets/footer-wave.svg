<svg width="1000" height="96" viewBox="0 0 1000 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated wave footer</title>
  <desc id="desc">Wave-only animated footer for a GitHub profile README.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#F78166"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-240 0;240 0;-240 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="96" rx="18" fill="#0D1117"/>
  <path d="M0 52 C160 18 310 88 482 54 C655 20 782 82 1000 46 L1000 96 L0 96 Z" fill="url(#wave)" opacity="0.36">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0 52 C160 18 310 88 482 54 C655 20 782 82 1000 46 L1000 96 L0 96 Z; M0 44 C176 82 334 24 512 58 C686 90 812 30 1000 58 L1000 96 L0 96 Z; M0 52 C160 18 310 88 482 54 C655 20 782 82 1000 46 L1000 96 L0 96 Z"/>
  </path>
  <path d="M0 56 C210 24 360 82 532 58 C706 30 826 74 1000 50" stroke="url(#wave)" stroke-width="3" opacity="0.9">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 56 C210 24 360 82 532 58 C706 30 826 74 1000 50; M0 48 C208 78 376 30 544 62 C700 88 832 34 1000 62; M0 56 C210 24 360 82 532 58 C706 30 826 74 1000 50"/>
  </path>
</svg>
